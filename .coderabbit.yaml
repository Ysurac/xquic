# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit configuration for the mqvpn xquic fork.
# Rules live in AGENTS.md, harness/spec/architecture.md and
# harness/spec/validation.md (read as code guidelines); this file carries
# only routing and hints that a single diff cannot reveal and CI does not
# enforce. Settings equal to the CodeRabbit defaults are omitted (except
# `language`, kept as an explicit decision).

language: "en-US"
tone_instructions: "Terse engineering tone; no praise."

reviews:
  profile: "assertive"
  review_details: true
  sequence_diagrams: false
  suggested_labels: false
  suggested_reviewers: false

  auto_review:
    base_branches:
      - "^mqvpn-dev$"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
    ignore_title_keywords:
      - "[skip review]"

  path_filters:
    - "!docs/docs-zh/**"

  path_instructions:
    - path: "**"
      instructions: |
        Do not comment on code style; xquic follows the Nginx-derived style
        described in CONTRIBUTING.md. Treat consumer-visible API changes
        (see the linked mqvpn repository) as the first concern.
    - path: "include/xquic/xqc_configure.h"
      instructions: |
        Tracked with a deliberate committed default and regenerated by cmake
        on every build. A hunk here is either an intended default change,
        which the PR must state, or build residue to drop.

  tools:
    markdownlint:
      enabled: false
    languagetool:
      enabled: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      requirements: >-
        `[T] subject` or `[T]: subject`, where T is `+` add, `-` remove,
        `=` no behaviour change or `~` behaviour change; or `type: subject`
        / `type(scope): subject` with a lowercase type. Imperative mood, no
        trailing period, at most 72 characters. Squash merges reuse the
        title as the commit subject.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false

chat:
  art: false

knowledge_base:
  learnings:
    scope: "local"
  code_guidelines:
    filePatterns:
      - files: "harness/spec/architecture.md"
        applyTo: "**"
      - files: "harness/spec/validation.md"
        applyTo: "**"
  linked_repositories:
    - repository: "mp0rta/mqvpn"
      instructions: >-
        mp0rta/mqvpn is this fork's primary consumer: a multipath QUIC VPN
        that pins this repo as submodule third_party/xquic at a commit on
        mqvpn-main and links libxquic as a shared library. Its default branch
        is main, where fixes, features and xquic pin bumps land, so the PR
        body names mp0rta/mqvpn@main (or a companion PR) as the baseline.
        mqvpn includes only the public headers xquic/xquic.h,
        xquic/xqc_http3.h and xquic/xquic_typedef.h, plus one private header:
        src/transport/xqc_multipath.h in tests/test_xquic_abi_pin.c, which
        pins every xqc_path_state_t enumerator by value. Grep mqvpn's src/
        and tests/ for any symbol this PR touches. Fork-only surface mqvpn
        depends on: xqc_conn_settings_t.defer_send_flush and
        max_path_id_grant_max_value; the dynamic
        xqc_conn_stats_t.paths_info[] with paths_info_count;
        xqc_wlb_scheduler_cb; xqc_conn_set_dgram_flow_hash;
        xqc_h3_ext_capsule_*, xqc_h3_ext_connectip_*, xqc_h3_ext_masque_*.
        The behavioural contract is the "Consumer Contract (mqvpn)" section
        of harness/spec/architecture.md. When reviewing this fork: flag any
        change to a public struct layout, enum value, default setting,
        return code or callback semantics as consumer-visible and name the
        affected mqvpn file; on upstream merges, call out any of the above
        that upstream touched.
